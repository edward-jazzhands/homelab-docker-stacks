services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:${WEB_UI_PORT}
    ports:
      - ${WEB_UI_PORT}:${WEB_UI_PORT}
    volumes:
      - ${DATA_DIR}/beszel_data:/beszel_data
      - ${DATA_DIR}/beszel_socket:/beszel_socket
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:${WEB_UI_PORT}']
      interval: 120s
      start_period: 10s
      timeout: 5s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_DIR}/beszel_agent_data:/var/lib/beszel-agent
      - ${DATA_DIR}/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${WEB_UI_PORT}
      KEY: ${KEY}
      TOKEN: ${TOKEN}
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s